name: 'Flude Docs'
description: 'Generate documentation with Flude via the Flude SaaS control-plane (thin client, no engine bundled)'
branding:
  icon: 'book-open'
  color: 'blue'
inputs:
  api-token:
    description: >
      Flude API key (a Clerk API Key created once at app.flude.guide and stored as a
      repository or organization secret). Sent to the control-plane as a Bearer token.
    required: true
  language:
    description: >
      Project language. Only 'cpp' is accepted by the Flude SaaS for now; other languages are
      rejected by the control-plane with HTTP 400.
    required: false
    default: 'cpp'
  compile-commands-path:
    description: >
      Optional path to compile_commands.json, generated prior to this step (e.g., via cmake -DCMAKE_EXPORT_COMPILE_COMMANDS=ON).
      Read from disk by this action itself (it runs right after your build step, on the same
      runner) and its content sent to the control-plane -- compile_commands.json is conventionally
      .gitignore'd, so only the path would never reach the backend's own independent clone of your
      repository. Path is relative to the repository root (i.e. $GITHUB_WORKSPACE).
    required: false
  vcxproj-path:
    description: >
      Optional path to a .vcxproj file (MSVC project), used to statically extract include paths and macros when compile_commands.json isn't available. Must be a relative path within the repository.
    required: false
  vcxproj-configuration:
    description: >
      Optional MSBuild Configuration to select from the .vcxproj (e.g. 'Debug'). Defaults to 'Release' if the .vcxproj has no matching block.
    required: false
  vcxproj-platform:
    description: >
      Optional MSBuild Platform to select from the .vcxproj (e.g. 'ARM64'). Defaults to 'x64' if the .vcxproj has no matching block.
    required: false
  bazel-build-path:
    description: >
      Optional path to a BUILD or BUILD.bazel file, used to statically extract include paths and
      macros for a cc_library/cc_binary/cc_test target when compile_commands.json isn't available.
      Must be a relative path within the repository (to the file itself, not its containing
      directory).
    required: false
  bazel-target-name:
    description: >
      Optional Bazel target name (e.g. my_lib).
    required: false
  cmake-lists-path:
    description: >
      Optional path to a CMakeLists.txt file, used to statically extract include paths and
      macros (directory-scoped) when compile_commands.json isn't available.
      Must be a relative path within the repository (to the file itself, not its containing directory).
    required: false
  defines:
    description: >
      Optional macros the build passes with -D, one per line (NAME or NAME=VALUE), or a JSON array of
      strings. They select the #if branches the parser reads (e.g. GPU_SUPPORT).
    required: false
    default: ''
  cpp-std:
    description: >
      Optional C++ standard the syntactic parser evaluates #if for: c++11, c++14, c++17, c++20 or c++23.
      If omitted, the standard the repository's top-level CMakeLists.txt names is used, else c++17.
    required: false
    default: ''
  parser-backend:
    description: >
      Optional C++ parser backend. If omitted, the control-plane uses 'syntactic' for C++
      jobs; the vcxproj/bazel/cmake inputs are read by the syntactic backend (macros, and include
      directories declared inside the repository). 'doxygen' is not available to external
      accounts (the control-plane answers HTTP 403 parser_backend_not_allowed).
    required: false
    default: ''
  api-base-url:
    description: >
      Base URL of the Flude SaaS control-plane API.
    required: true
  format:
    description: "Output format: 'hugo_markdown' or 'html'."
    required: false
    default: 'hugo_markdown'
  strict:
    description: 'Enable Strict Compilation Mode.'
    required: false
    default: 'false'
  poll-interval-seconds:
    description: 'How often to poll GET /jobs/{id} for job status.'
    required: false
    default: '10'
  max-wait-seconds:
    description: >
      Client-side safety-net timeout for polling. The authoritative job timeout (currently
      10 minutes) is enforced server-side by the control-plane; this only guards against the
      server never reporting a terminal status at all.
    required: false
    default: '900'
outputs:
  job-id:
    description: 'The job ID assigned by the control-plane.'
  status:
    description: >
      Terminal job status (e.g. succeeded, failed, rejected_too_large,
      rejected_organization, rejected_private).
  parser-backend:
    description: 'The parser backend that actually ran (e.g. doxygen, syntactic), if reported by the control-plane.'
  result-url:
    description: 'Signed, short-TTL GCS URL to the result archive. It expires quickly - download it immediately.'
  result-path:
    description: 'Local path to the downloaded result archive.'
  sarif-path:
    description: >
      Local path to a SARIF report extracted from the result archive (report.sarif at the
      archive root - a best-effort assumption, see README.md), if one was found. Feed this into
      github/codeql-action/upload-sarif as a separate workflow step to publish it to Code
      Scanning. Empty if no SARIF report was found in the archive.
  summary-path:
    description: >
      Local path to the same markdown findings report already appended to $GITHUB_STEP_SUMMARY,
      as a plain file. $GITHUB_STEP_SUMMARY is allocated fresh per step by the runner, so a later
      step in your workflow can't read this step's contribution back through that environment
      variable - use this output instead (e.g. to post it as a PR comment). Empty if no SARIF
      report was found in the archive.
runs:
  using: 'node20'
  main: 'src/index.js'

