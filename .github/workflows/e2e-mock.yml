name: E2E against a mock control-plane

# Runs the action for real (via `uses: ./`), against a local mock standing in
# for the not-yet-built DEL-B23 control-plane. This satisfies DEL-B22's
# acceptance criterion (job submitted, polled, downloaded) for everything the
# thin client itself owns - it does NOT exercise the real control-plane,
# free-gate logic, or GCS. See README.md's "What this repo does and does not
# verify" section.

on:
  push:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Start mock control-plane
        run: |
          node test-support/start-mock-server.mjs &
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8787/fake-results/warmup >/dev/null 2>&1; then break; fi
            sleep 0.5
          done

      - name: Run flude-action against the mock control-plane
        id: flude
        uses: ./
        with:
          api-token: 'test-token'
          api-base-url: 'http://127.0.0.1:8787'
          format: 'markdown'
          poll-interval-seconds: '1'
          max-wait-seconds: '60'

      - name: Verify outputs
        run: |
          set -euo pipefail
          test -n "${{ steps.flude.outputs.job-id }}"
          test "${{ steps.flude.outputs.status }}" = "succeeded"
          test -n "${{ steps.flude.outputs.result-url }}"
          test -f "${{ steps.flude.outputs.result-path }}"
          echo "job-id: ${{ steps.flude.outputs.job-id }}"
          echo "result-path: ${{ steps.flude.outputs.result-path }}"

      - name: Send Alerts
        if: always()
        uses: ./.github/actions/notify
        with:
          status: ${{ job.status }}
          telegram_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram_to: ${{ secrets.TELEGRAM_CHAT_ID }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  # Same as above, but the mock's result archive actually contains a
  # report.sarif with 15 findings - proves DEL-B25's GitHub reporting
  # (annotations / step summary / sarif-path output) end to end, not just
  # via unit tests against the mock in isolation.
  e2e-sarif:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Start mock control-plane (with-sarif scenario)
        env:
          MOCK_PORT: '8788'
          MOCK_SCENARIO: 'with-sarif'
        run: |
          node test-support/start-mock-server.mjs &
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8788/fake-results/warmup >/dev/null 2>&1; then break; fi
            sleep 0.5
          done

      - name: Run flude-action against the mock control-plane
        id: flude
        uses: ./
        with:
          api-token: 'test-token'
          api-base-url: 'http://127.0.0.1:8788'
          format: 'markdown'
          poll-interval-seconds: '1'
          max-wait-seconds: '60'

      - name: Verify SARIF output and step summary are complete
        # Reads back summary-path, NOT $GITHUB_STEP_SUMMARY - the runner
        # allocates a fresh, empty $GITHUB_STEP_SUMMARY file per step, so a
        # later step (this one) can never read an earlier step's write
        # through that same env var, only through a real persisted file.
        # See README.md's "GitHub-specific reporting" section for how this
        # was actually root-caused on a real GitHub-hosted runner (it never
        # reproduced locally - both the earlier "different cwd" guess and
        # this actual cause were confirmed empirically, not assumed).
        run: |
          set -euo pipefail
          test -n "${{ steps.flude.outputs.sarif-path }}"
          test -f "${{ steps.flude.outputs.sarif-path }}"
          python3 -c "import json,sys; json.load(open(sys.argv[1]))" "${{ steps.flude.outputs.sarif-path }}"

          test -n "${{ steps.flude.outputs.summary-path }}"
          test -f "${{ steps.flude.outputs.summary-path }}"
          grep -q '15 finding(s)' "${{ steps.flude.outputs.summary-path }}"
          # RULE-14 is past the old (removed) 10-item cap - proves the
          # summary isn't silently truncated back to it.
          grep -q 'RULE-14' "${{ steps.flude.outputs.summary-path }}"
          grep -q 'finding number 14' "${{ steps.flude.outputs.summary-path }}"

      - name: Send Alerts
        if: always()
        uses: ./.github/actions/notify
        with:
          status: ${{ job.status }}
          telegram_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram_to: ${{ secrets.TELEGRAM_CHAT_ID }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
