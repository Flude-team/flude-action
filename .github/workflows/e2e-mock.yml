name: E2E against a mock control-plane

# Runs the action for real (via `uses: ./`), against a local mock standing in
# for the not-yet-built DEL-B23 control-plane. This satisfies DEL-B22's
# acceptance criterion (job submitted, polled, downloaded) for everything the
# thin client itself owns - it does NOT exercise the real control-plane,
# free-gate logic, or GCS. See README.md's "What this repo does and does not
# verify" section.

on:
  push:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Start mock control-plane
        run: |
          node test-support/start-mock-server.mjs &
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8787/fake-results/warmup >/dev/null 2>&1; then break; fi
            sleep 0.5
          done

      - name: Run flude-action against the mock control-plane
        id: flude
        uses: ./
        with:
          api-token: 'test-token'
          api-base-url: 'http://127.0.0.1:8787'
          format: 'markdown'
          poll-interval-seconds: '1'
          max-wait-seconds: '60'

      - name: Verify outputs
        run: |
          set -euo pipefail
          test -n "${{ steps.flude.outputs.job-id }}"
          test "${{ steps.flude.outputs.status }}" = "succeeded"
          test -n "${{ steps.flude.outputs.result-url }}"
          test -f "${{ steps.flude.outputs.result-path }}"
          echo "job-id: ${{ steps.flude.outputs.job-id }}"
          echo "result-path: ${{ steps.flude.outputs.result-path }}"

  # Same as above, but the mock's result archive actually contains a
  # report.sarif with 15 findings - proves DEL-B25's GitHub reporting
  # (annotations / step summary / sarif-path output) end to end, not just
  # via unit tests against the mock in isolation.
  e2e-sarif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Start mock control-plane (with-sarif scenario)
        env:
          MOCK_PORT: '8788'
          MOCK_SCENARIO: 'with-sarif'
        run: |
          node test-support/start-mock-server.mjs &
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8788/fake-results/warmup >/dev/null 2>&1; then break; fi
            sleep 0.5
          done

      - name: Run flude-action against the mock control-plane
        id: flude
        uses: ./
        with:
          api-token: 'test-token'
          api-base-url: 'http://127.0.0.1:8788'
          format: 'markdown'
          poll-interval-seconds: '1'
          max-wait-seconds: '60'

      - name: DEBUG - non-aborting check of every assertion, with full file dumps
        # Temporary: `set -e` + `grep -q` swallowed exactly which assertion
        # failed (grep -q prints nothing either way). Run every check
        # without exiting early and dump full file contents so the real
        # failure point is unambiguous instead of inferred from silence.
        run: |
          echo "sarif-path output: '${{ steps.flude.outputs.sarif-path }}'"
          echo "--- test -f sarif-path ---"
          test -f "${{ steps.flude.outputs.sarif-path }}"; echo "exit: $?"
          echo "--- cat sarif-path ---"
          cat "${{ steps.flude.outputs.sarif-path }}"; echo "(cat exit: $?)"
          echo "--- python3 json.load on sarif-path ---"
          python3 -c "import json,sys; json.load(open(sys.argv[1]))" "${{ steps.flude.outputs.sarif-path }}"; echo "exit: $?"
          echo "--- test -f \$GITHUB_STEP_SUMMARY ---"
          test -f "$GITHUB_STEP_SUMMARY"; echo "exit: $?"
          echo "--- cat \$GITHUB_STEP_SUMMARY ---"
          cat "$GITHUB_STEP_SUMMARY"; echo "(cat exit: $?)"
          echo "--- grep checks (each independent, none abort the script) ---"
          grep -n '15 finding(s)' "$GITHUB_STEP_SUMMARY"; echo "grep '15 finding(s)' exit: $?"
          grep -n 'RULE-14' "$GITHUB_STEP_SUMMARY"; echo "grep 'RULE-14' exit: $?"
          grep -n 'finding number 14' "$GITHUB_STEP_SUMMARY"; echo "grep 'finding number 14' exit: $?"
          echo "=== done, nothing aborted ==="
