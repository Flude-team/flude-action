name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - run: npm test

      - name: Send Alerts
        # appleboy/telegram-action is a container action -- GitHub only supports those on
        # Linux runners ("Container action is only supported on Linux"). Without the
        # runner.os guard this step hard-fails on windows-latest/macos-latest on every run,
        # which (combined with the default fail-fast: true, now disabled above) used to
        # cancel the still-running ubuntu-latest/windows-latest test jobs before npm test
        # could finish there.
        if: always() && runner.os == 'Linux'
        uses: ./.github/actions/notify
        with:
          status: ${{ job.status }}
          telegram_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram_to: ${{ secrets.TELEGRAM_CHAT_ID }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          create_issue: 'false'

  tools:
    # tools/doxyfile_to_flude.py: standard library only; the tests re-read its YAML with PyYAML.
    # Pinned to ubuntu-24.04: `ubuntu-latest` is Ubuntu 26.04 since 2026-11, which has no Python 3.9, and 3.9 stays in the
    # matrix on purpose (RHEL 9 ships it). Revisit when the ubuntu-24.04 image is retired.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install pyyaml
      - run: python -m unittest discover tools

      # Failure-only alert (2026-11-18, K37 check): this job had none, so its failure turned the run red on GitHub
      # and nobody was told. Failure-only on purpose: the workflow's other job already sends the usual alert,
      # a second alert on every success would read as a duplicate.
      - name: Send Alert on Failure
        if: failure()
        continue-on-error: true  # a missing Telegram secret must never fail the job
        uses: ./.github/actions/notify
        with:
          status: failure
          telegram_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram_to: ${{ secrets.TELEGRAM_CHAT_ID }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          create_issue: 'false'
