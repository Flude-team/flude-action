name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test

      - name: Send Alerts
        # appleboy/telegram-action is a container action -- GitHub only supports those on
        # Linux runners ("Container action is only supported on Linux"). Without the
        # runner.os guard this step hard-fails on windows-latest/macos-latest on every run,
        # which (combined with the default fail-fast: true, now disabled above) used to
        # cancel the still-running ubuntu-latest/windows-latest test jobs before npm test
        # could finish there.
        if: always() && runner.os == 'Linux'
        uses: ./.github/actions/notify
        with:
          status: ${{ job.status }}
          telegram_token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          telegram_to: ${{ secrets.TELEGRAM_CHAT_ID }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          create_issue: 'false'
